<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PB · MatchWeb</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="pb-legacy-page">
    <main class="dashboard legacy-container">
      <h1>⚽ 足球比赛监控面板</h1>

      <section class="filters filter-section" aria-label="查询参数">
        <div class="filter-container">
        <div class="field filter-group">
          <label for="match-date">比赛日期：</label>
          <input id="match-date" type="date" />
        </div>
        <fieldset class="status-filter pb-status-filter filter-group">
          <legend>比赛状态：</legend>
          <div class="legacy-checkboxes">
            <input id="status-not-started" name="status" type="checkbox" value="未开始" checked />
            <label for="status-not-started">赛前预警</label>
            <input id="status-live" name="status" type="checkbox" value="进行中" checked />
            <label for="status-live">滚球预警</label>
            <input id="status-finished" name="status" type="checkbox" value="完" />
            <label for="status-finished">完场</label>
          </div>
        </fieldset>
        <div class="legacy-account filter-group">
          <a id="home-link" class="btn-home" href="/" hidden>返回首页</a>
          <span class="user-info">当前用户: <strong id="session-username">—</strong></span>
          <a class="btn-logout" href="/logout">退出</a>
        </div>
        <button id="query-button" class="query-button" type="button">🔍 查询</button>
        </div>
      </section>

      <section class="stats-bar" aria-live="polite">
        <span class="stats-text">共找到 <strong class="stats-num" id="total-count">0</strong> 场比赛</span>
        <span class="stats-text">作废: <strong class="stats-num" id="invalid-count">0</strong> | 关注: <strong class="stats-num" id="followed-count">0</strong></span>
        <span class="stats-text"><span id="result-summary">正在读取比赛数据…</span> · <span id="updated-at"></span> · <span id="refresh-state">每 60 秒自动刷新</span></span>
      </section>

      <section class="results data-section" aria-live="polite">
        <span class="sr-only">符合条件的比赛</span>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>比赛ID</th>
                <th>联赛</th>
                <th>主客队信息</th>
                <th>开赛时间</th>
                <th>实时状态</th>
                <th>当前比分</th>
                <th>预警盘口</th>
                <th>封盘详情</th>
                <th>操作</th>
                <th>下注</th>
              </tr>
            </thead>
            <tbody id="match-rows"></tbody>
          </table>
          <div id="empty-state" class="empty-state" hidden>暂无符合条件的数据</div>
          <div id="error-state" class="empty-state error-state" hidden></div>
        </div>
      </section>

      <div class="legend-bar" aria-label="状态图例">
        <span class="legend-item"><span class="legend-color invalid"></span>已作废</span>
        <span class="legend-item"><span class="legend-color watched"></span>已关注</span>
      </div>
    </main>

    <dialog id="bet-dialog" class="user-dialog bet-dialog">
      <form id="bet-form">
        <div class="dialog-heading">
          <div><h2>下注设置</h2><p id="bet-match-label"></p></div>
          <button id="bet-dialog-close" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <div id="bet-entries" class="bet-entries"></div>
        <button id="add-bet-button" class="secondary-button add-bet-button" type="button">＋ 增加注单</button>
        <p id="bet-form-error" class="inline-error" hidden></p>
        <div class="dialog-actions">
          <button id="bet-dialog-cancel" class="secondary-button" type="button">取消</button>
          <button id="bet-dialog-save" class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <script src="/company-47-suspensions.js" defer></script>
  </body>
</html>
